# ABOUTME: Runs the Evaluator service on the NAS with a read-only root, no capabilities, and data under /volume2.
services:
  evaluator-agent:
    image: "${EVALUATOR_IMAGE:-evaluator-agent:local}"
    container_name: evaluator-agent
    restart: unless-stopped
    # Host networking: this NAS drops bridge-network NAT for outbound traffic, which the
    # evaluator needs for GitHub, the OpenAI API, and package registries. The service
    # listens on 8080; the Coding Agent owns 8081.
    network_mode: host
    env_file:
      - ./.runtime.env
    environment:
      PORT: "8080"
      EVALUATOR_WORK_ROOT: /work
      EVALUATOR_MANIFEST: /config/manifest.json
      EVALUATOR_GITHUB_APP_PRIVATE_KEY_FILE: /config/github-app.pem
      # Shared caches so each run does not re-download dependencies and browsers.
      EVALUATOR_COMMAND_ENV_npm_config_cache: /cache/npm
      EVALUATOR_COMMAND_ENV_PLAYWRIGHT_BROWSERS_PATH: /cache/ms-playwright
    volumes:
      - "${EVALUATOR_DATA:-/volume2/docker/evaluator-agent-data}/work:/work"
      - "${EVALUATOR_DATA:-/volume2/docker/evaluator-agent-data}/cache:/cache"
      - ./manifest.json:/config/manifest.json:ro
      # The installer places this copy, readable only by root; the service opens it before dropping root.
      - "${EVALUATOR_DATA:-/volume2/docker/evaluator-agent-data}/secrets/github-app.pem:/config/github-app.pem:ro"
    # Starts as root with only SETUID and SETGID so it can read the root-only key, then switches
    # to the evaluator user for good before any job runs (src/privileges.ts).
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
