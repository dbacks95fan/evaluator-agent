services:
  evaluator:
    build: .
    image: "${EVALUATOR_IMAGE:-evaluator-agent:local}"
    container_name: evaluator-agent
    restart: unless-stopped
    ports:
      - "${EVALUATOR_HTTP_PORT:-8080}:8080"
    env_file:
      - ./.runtime.env
    environment:
      PORT: "8080"
      EVALUATOR_INPUT_ROOT: /jobs/input
      EVALUATOR_OUTPUT_ROOT: /jobs/output
      # Codex records its API-key session under HOME; /tmp is the container's writable, ephemeral storage.
      HOME: /tmp
      CODEX_HOME: /tmp/.codex
    # Docker's embedded resolver cannot reach the NAS resolver from this bridge network.
    # Use public resolvers only for this stateless evaluator service, keeping the change scoped.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - type: bind
        source: ./jobs/input
        target: /jobs/input
        read_only: true
      - type: bind
        source: ./jobs/output
        target: /jobs/output
    read_only: true
    tmpfs:
      - /tmp
    command:
      # Codex requires a login session even when OPENAI_API_KEY is already available to the process.
      - sh
      - -ec
      - |
        mkdir -p "$$CODEX_HOME"
        printenv OPENAI_API_KEY | codex login --with-api-key
        exec node dist/service.js
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
