services:
  evaluator:
    build: .
    image: evaluator-agent:local
    container_name: evaluator-agent
    restart: unless-stopped
    ports:
      - "${EVALUATOR_HTTP_PORT:-8080}:8080"
    env_file:
      - ./.runtime.env
    environment:
      PORT: "8080"
      EVALUATOR_INPUT_ROOT: /jobs/input
      EVALUATOR_OUTPUT_ROOT: /jobs/output
    volumes:
      - type: bind
        source: ./jobs/input
        target: /jobs/input
        read_only: true
      - type: bind
        source: ./jobs/output
        target: /jobs/output
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
